.ofs-video-screen{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.ofs-video-media{position:absolute;inset:0;width:100%;height:100%;display:block;background:transparent}
.ofs-video-bar{flex:none;height:${Ar}px;display:flex;align-items:center;gap:12px;padding:0 12px;font:600 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;user-select:none}
.ofs-video-dots{display:flex;gap:6px;flex:none}
.ofs-video-dots i{display:block;width:11px;height:11px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.ofs-video-dots i:nth-child(2){background:#febc2e}
.ofs-video-dots i:nth-child(3){background:#28c840}
.ofs-video-url{flex:1 1 auto;min-width:0;max-width:62%;margin:0 auto;transform:translateX(-24px);height:21px;line-height:21px;border-radius:7px;padding:0 12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.ofs-video-play{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);width:clamp(44px,15%,88px);aspect-ratio:1/1;height:auto;border:0;padding:0;margin:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ofs-v-accent);color:var(--ofs-v-on-accent);box-shadow:0 12px 32px rgba(0,0,0,.35),0 0 0 6px rgba(255,255,255,.16);cursor:pointer;transition:transform .18s ease}
.ofs-video-play svg{width:44%;height:44%;margin-left:7%}
.ofs-video-play:hover{transform:translate(-50%,-50%) scale(1.07)}
.ofs-video-play:focus-visible{outline:3px solid #fff;outline-offset:4px}
.ofs-video-play[hidden],.ofs-video-hint[hidden]{display:none}
.ofs-video-blocked .ofs-video-play{animation:ofs-v-pulse 1.8s ease-out infinite}
@keyframes ofs-v-pulse{0%{box-shadow:0 12px 32px rgba(0,0,0,.35),0 0 0 0 var(--ofs-v-ring)}75%,100%{box-shadow:0 12px 32px rgba(0,0,0,.35),0 0 0 22px rgba(0,0,0,0)}}
.ofs-video-hint{position:absolute;left:50%;bottom:9%;z-index:2;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(10,10,20,.66);color:#fff;font:600 12px/1.2 system-ui,sans-serif;white-space:nowrap;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ofs-video-toggle{cursor:pointer;outline:none}
.ofs-video-toggle:focus-visible{box-shadow:inset 0 0 0 3px var(--ofs-v-accent)}
.ofs-video-error{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;background:rgba(10,10,20,.72);color:#fff;font:600 14px/1.4 system-ui,sans-serif}
.ofs-video-empty{position:absolute;inset:0;border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;overflow:hidden;font:600 15px/1.25 system-ui,-apple-system,'Segoe UI',sans-serif}
.ofs-video-empty::before{content:'';position:absolute;inset:10px;border:2px dashed currentColor;border-radius:inherit;opacity:.18;pointer-events:none}
.ofs-video-empty-icon{width:clamp(40px,14%,76px);aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ofs-v-accent);color:var(--ofs-v-on-accent);box-shadow:0 0 0 8px var(--ofs-v-ring)}
.ofs-video-empty-icon svg{width:44%;height:44%;margin-left:7%}
.ofs-video-empty small{font-weight:500;font-size:12px;opacity:.65}
@media (prefers-reduced-motion:reduce){.ofs-video-blocked .ofs-video-play{animation:none}}
.ofs-video-cropped{container-type:size}
.ofs-video-crop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;width:100%;height:100%;width:min(100cqw,calc(100cqh * var(--ofs-v-r)));height:min(100cqh,calc(100cqw / var(--ofs-v-r)))}
.ofs-video-crop.is-cover{width:max(100cqw,calc(100cqh * var(--ofs-v-r)));height:max(100cqh,calc(100cqw / var(--ofs-v-r)))}
.ofs-video-crop .ofs-video-media{inset:auto;object-fit:fill!important}
.ofs-vbar{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 6px;border-radius:12px;background:rgba(12,10,24,.72);color:#fff;font:600 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .2s ease;user-select:none}
.ofs-video:hover .ofs-vbar,.ofs-vbar:focus-within,.ofs-video:not([data-state=playing]) .ofs-vbar{opacity:1}
.ofs-vbar button{flex:none;width:30px;height:30px;border:0;padding:0;margin:0;border-radius:8px;display:flex;align-items:center;justify-content:center;background:transparent;color:inherit;cursor:pointer}
.ofs-vbar button:hover{background:rgba(255,255,255,.14)}
.ofs-vbar button:focus-visible,.ofs-vbar-track:focus-visible{outline:2px solid var(--ofs-v-accent);outline-offset:2px}
.ofs-vbar-time{flex:none;font-variant-numeric:tabular-nums;opacity:.9;white-space:nowrap}

.ofs-audio-compact{gap:12px;padding:0 14px 0 10px}
.ofs-audio-native{padding:0 14px;justify-content:center}
.ofs-audio-native-el{width:100%;display:block;max-height:100%}
.ofs-audio-btn{flex:none;width:52px;height:52px;border-radius:50%;border:0;padding:0;margin:0;display:flex;align-items:center;justify-content:center;background:var(--ofs-a-accent);color:var(--ofs-a-on-accent);cursor:pointer;box-shadow:0 6px 16px var(--ofs-a-soft);transition:transform .15s ease}
.ofs-audio-btn .ofs-glyph-play{margin-left:3px}
.ofs-audio-compact .ofs-audio-btn{width:36px;height:36px}
.ofs-audio-compact .ofs-audio-btn .ofs-glyph-play{margin-left:2px}
.ofs-audio-btn:hover{transform:scale(1.06)}
.ofs-audio-btn:active{transform:scale(.96)}
.ofs-audio-btn:focus-visible,.ofs-audio-mute:focus-visible{outline:3px solid var(--ofs-a-ring);outline-offset:3px}
.ofs-audio-blocked .ofs-audio-btn{animation:ofs-a-pulse 1.8s ease-out infinite}
.ofs-audio-native.ofs-audio-blocked{box-shadow:0 0 0 3px var(--ofs-a-ring)!important}
@keyframes ofs-a-pulse{0%{box-shadow:0 0 0 0 var(--ofs-a-ring)}75%,100%{box-shadow:0 0 0 14px rgba(0,0,0,0)}}
.ofs-audio-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ofs-audio-compact .ofs-audio-main{flex-direction:row;align-items:center;gap:12px}
.ofs-audio-top{display:flex;align-items:baseline;gap:12px;min-width:0}
.ofs-audio-title{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ofs-audio-compact .ofs-audio-title{flex:0 1 auto;max-width:42%;font-size:14px}
.ofs-audio-time{flex:none;font-size:12.5px;font-weight:600;opacity:.66;font-variant-numeric:tabular-nums;white-space:nowrap}
.ofs-audio-track{position:relative;flex:1 1 auto;min-width:40px;height:6px;border-radius:999px;background:var(--ofs-a-track);cursor:pointer;touch-action:none;outline:none}
.ofs-audio-track::before{content:'';position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.ofs-audio-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:var(--ofs-a-accent)}
.ofs-audio-knob{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ofs-a-accent);box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 3px var(--ofs-a-soft);transform:scale(.0001);transition:transform .15s ease}
.ofs-audio:hover .ofs-audio-knob,.ofs-audio-track:focus-visible .ofs-audio-knob,.ofs-audio-seeking .ofs-audio-knob{transform:scale(1)}
.ofs-audio-track:focus-visible{box-shadow:0 0 0 3px var(--ofs-a-ring)}
.ofs-audio-vol{flex:none;display:flex;align-items:center;gap:6px}
.ofs-audio-mute{width:32px;height:32px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:inherit;opacity:.72;cursor:pointer}
.ofs-audio-mute:hover{opacity:1;background:var(--ofs-a-soft)}
.ofs-audio-volume{width:64px;accent-color:var(--ofs-a-accent);cursor:pointer;margin:0}
.ofs-audio-empty{gap:14px}
.ofs-audio-empty-icon{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ofs-a-soft);color:var(--ofs-a-accent)}
.ofs-audio-compact .ofs-audio-empty-icon{width:34px;height:34px}
.ofs-audio-empty-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.ofs-audio-empty-text strong{font-size:15px;font-weight:700}
.ofs-audio-empty-text small{font-size:12px;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ofs-scrolltext.ofs-fade.ofs-at-top .ofs-scrolltext-body{-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 56px),transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 56px),transparent 100%)}
.ofs-scrolltext.ofs-fade.ofs-at-end .ofs-scrolltext-body{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30px,#000 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 30px,#000 100%)}
.ofs-scrolltext.ofs-fade.ofs-at-top.ofs-at-end .ofs-scrolltext-body{-webkit-mask-image:none;mask-image:none}
.ofs-scrolltext-hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);color:var(--ofs-accent);pointer-events:none;animation:ofs-hint 1.6s ease-in-out infinite;transition:opacity .3s}
.ofs-at-end .ofs-scrolltext-hint{opacity:0}
@keyframes ofs-hint{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,4px)}}
.ofs-progress{display:flex;align-items:center;justify-content:center;position:relative}
.ofs-progress-track{width:100%;height:100%;border-radius:999px;overflow:hidden}
.ofs-progress-fill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.ofs-progress-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none}
.ofs-progress-label-outside .ofs-progress-label{inset:auto 0 100% auto;margin-bottom:6px}
.ofs-progress-arc{transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)}
.ofs-unknown{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fff4f4;color:#b42318;border:2px dashed #f3a5a5;font:600 13px system-ui,sans-serif;border-radius:8px}
.ofs-bg-image{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;pointer-events:none}
.ofs-bg-dim{position:absolute;inset:0;pointer-events:none}
.ofs-page-static{position:relative;overflow:hidden}
.ofs-player-slides .ofs-stage-wrap{position:absolute;box-shadow:0 24px 70px rgba(0,0,0,.28);border-radius:2px}
.ofs-stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.ofs-slide{position:absolute;inset:0;overflow:hidden}
.ofs-nav{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:rgba(18,14,40,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;opacity:.45;transition:opacity .25s;font:700 14px/1 system-ui,sans-serif;z-index:20;user-select:none}
.ofs-player:hover .ofs-nav,.ofs-nav:focus-within{opacity:1}
.ofs-nav button{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ofs-nav button:hover{background:rgba(255,255,255,.16)}
.ofs-nav button:disabled{opacity:.3;cursor:default;background:transparent}
.ofs-nav button:focus-visible{outline:2px solid #fff}
.ofs-nav-count{min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.ofs-player-page{overflow-y:auto;overflow-x:hidden}
.ofs-section{position:relative;overflow:hidden;width:100%}
.ofs-section-inner{position:relative;margin:0 auto}
.ofs-section-stage{position:absolute;left:0;top:0;transform-origin:0 0}
.ofs-error{font:16px/1.5 system-ui,sans-serif;padding:40px;color:#b42318}
@media (prefers-reduced-motion:reduce){.ofs-gallery-item,.ofs-progress-fill,.ofs-progress-arc{transition:none}.ofs-scrolltext-hint{animation:none}}
