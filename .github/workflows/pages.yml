name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Relative base paths: the site works at /<repo>/ on Pages.
      # dist-site/ = landing page + studio/ (the single-file editor) + showcase/ (exported OneFiles) + media/.
      # It is committed too (v0.7); rebuilding here and checking it matches
      # guarantees Pages serves exactly the files in the repository.
      - run: npm run build:site
      - name: Deployed site equals the committed dist-site/
        run: git diff --exit-code --stat -- dist-site/ && test -z "$(git ls-files --others --exclude-standard -- dist-site)"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
