name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Committed dist/ matches the source
        run: git diff --exit-code --stat dist/ || (echo "::error::dist/ is out of date. Run 'npm run build' and commit dist/." && exit 1)
      - name: Build the public site (landing page, studio/, exported showcases)
        run: node scripts/build-site.mjs
      # The complete website is committed (v0.7) so it can be hosted from a
      # download without building. It must be exactly what the source produces:
      # no changed tracked files and no new untracked ones.
      - name: Committed dist-site/ matches the source
        run: |
          git diff --exit-code --stat -- dist-site/ || (echo "::error::dist-site/ is out of date. Run 'npm run build:site' and commit dist-site/." && exit 1)
          untracked="$(git ls-files --others --exclude-standard -- dist dist-site)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::The build produced files that are not committed. Run 'npm run build:site' and commit dist-site/."
            exit 1
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (editor, exported files via file://, landing page, showcases, hosted dist-site/)
        run: npm run test:e2e
      - name: Upload exported test files and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
