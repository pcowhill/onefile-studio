name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Committed dist/ matches the source
        run: git diff --exit-code --stat dist/ || (echo "::error::dist/ is out of date. Run 'npm run build' and commit dist/." && exit 1)
      - name: Build the public site (landing page, studio/, exported showcases)
        run: node scripts/build-site.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (editor, exported files via file://, landing page and showcases)
        run: npm run test:e2e
      - name: Upload exported test files and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
