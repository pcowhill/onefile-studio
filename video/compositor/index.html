<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OneFile Studio — video compositor</title>
    <style>
      @font-face {
        font-family: 'Nunito Variable';
        font-weight: 200 1000;
        src: url(/node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Inter Variable';
        font-weight: 100 900;
        src: url(/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Fraunces Variable';
        font-style: italic;
        font-weight: 100 900;
        src: url(/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2) format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0f0828;
      }
      * {
        box-sizing: border-box;
      }
      .stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: 'Inter Variable', system-ui, sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, #241465 0%, #160c3d 48%, #0e0726 100%);
      }
      .pal-light .bg {
        background: linear-gradient(160deg, #f7f3ff 0%, #efe8ff 100%);
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.55;
      }
      .b1 {
        width: 900px;
        height: 900px;
        left: -260px;
        top: 380px;
        background: #6d4aff;
      }
      .b2 {
        width: 760px;
        height: 760px;
        right: -220px;
        top: -300px;
        background: #ff4d8d;
        opacity: 0.38;
      }
      .b3 {
        width: 420px;
        height: 420px;
        right: 280px;
        bottom: -260px;
        background: #ffd23f;
        opacity: 0.22;
      }
      .dots {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 1.5px 1.5px, rgba(255, 255, 255, 0.11) 1.6px, transparent 2px) 0 0 / 34px 34px;
      }
      .shot {
        position: absolute;
        inset: 0;
      }
      .vp {
        position: absolute;
        overflow: hidden;
      }
      .is-window .vp,
      .is-browser .vp {
        border-radius: 22px;
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.14),
          0 50px 100px -20px rgba(0, 0, 0, 0.65);
        background: #0b0620;
      }
      .footage {
        position: relative;
        overflow: hidden;
      }
      .footage img {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        display: block;
      }
      .chrome {
        height: 58px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        background: #f3f0fb;
        color: #3b2f66;
        font: 600 21px/1 'Inter Variable';
      }
      .chrome > i {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #ff6b6b;
      }
      .chrome > i:nth-child(2) {
        background: #ffc94d;
      }
      .chrome > i:nth-child(3) {
        background: #3ccf7a;
      }
      .addr {
        margin-left: 18px;
        flex: 1;
        height: 38px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-radius: 11px;
        background: #fff;
        box-shadow: inset 0 0 0 1.5px #e3dcf6;
        color: #3b2f66;
        white-space: nowrap;
        overflow: hidden;
      }
      .badge {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 16px;
        border-radius: 11px;
        background: #1d1145;
        color: #ffd23f;
        font: 850 20px/1 'Nunito Variable';
      }
      /* captions */
      .caption {
        position: absolute;
        left: 50%;
        bottom: calc(34px * var(--cs, 1));
        display: flex;
        align-items: center;
        gap: calc(18px * var(--cs, 1));
        padding: calc(14px * var(--cs, 1)) calc(32px * var(--cs, 1)) calc(14px * var(--cs, 1)) calc(16px * var(--cs, 1));
        border-radius: calc(22px * var(--cs, 1));
        background: #fff;
        color: #1d1145;
        box-shadow:
          0 4px 0 rgba(29, 17, 69, 0.4),
          0 24px 50px -10px rgba(0, 0, 0, 0.45);
        white-space: nowrap;
        z-index: 100;
      }
      .cap-badge {
        min-width: calc(54px * var(--cs, 1));
        height: calc(54px * var(--cs, 1));
        padding: 0 calc(12px * var(--cs, 1));
        border-radius: calc(16px * var(--cs, 1));
        display: grid;
        place-items: center;
        background: var(--c);
        color: #fff;
        font: 950 calc(30px * var(--cs, 1)) / 1 'Nunito Variable';
      }
      .cap-text {
        font: 900 calc(40px * var(--cs, 1)) / 1.1 'Nunito Variable';
        letter-spacing: -0.01em;
      }
      .cap-text small {
        display: block;
        margin-top: 4px;
        font: 600 calc(23px * var(--cs, 1)) / 1.2 'Inter Variable';
        color: #5e5680;
        letter-spacing: 0;
      }
      /* headline overlay */
      .headline {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 260px 110px 92px;
        background: linear-gradient(180deg, transparent, rgba(12, 6, 32, 0.78) 60%);
        z-index: 90;
      }
      .hl-kicker {
        display: inline-block;
        margin-bottom: 22px;
        padding: 12px 22px;
        border-radius: 14px;
        background: #ffd23f;
        color: #1d1145;
        font: 900 30px/1 'Nunito Variable';
      }
      .hl-line {
        font: 950 118px/1 'Nunito Variable';
        letter-spacing: -0.04em;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
      }
      .hl-line em,
      .o-line em {
        font-family: 'Fraunces Variable';
        font-weight: 600;
        font-style: italic;
        background: linear-gradient(95deg, #b9a6ff, #ff7eb3);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding-right: 0.08em;
      }
      /* step rail */
      .rail {
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 95;
      }
      .rail .step {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 46px;
        padding: 0 20px 0 8px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.72);
        font: 850 23px/1 'Nunito Variable';
      }
      .rail .step b {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.14);
        font-weight: 950;
        font-size: 19px;
      }
      .rail .step.is-on {
        background: #fff;
        color: #1d1145;
      }
      .rail .step.is-on b {
        background: var(--accent);
        color: #fff;
      }
      /* file shot */
      .file-icon {
        position: absolute;
        left: 50%;
        top: 44%;
        width: 300px;
        filter: drop-shadow(14px 16px 0 rgba(0, 0, 0, 0.35));
      }
      .file-name {
        position: absolute;
        left: 50%;
        top: 690px;
        font: 950 66px/1 'Nunito Variable';
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .file-meta {
        position: absolute;
        left: 0;
        right: 0;
        top: 784px;
        text-align: center;
        font: 650 32px/1 'Inter Variable';
        color: #d6ccff;
      }
      .chip {
        position: absolute;
        left: 50%;
        top: 44%;
        padding: 14px 24px;
        border-radius: 16px;
        font: 900 30px/1 'Nunito Variable';
        color: #1d1145;
        white-space: nowrap;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
      }
      .chip.c0 {
        background: #ff7eb3;
      }
      .chip.c1 {
        background: #ffd23f;
      }
      .chip.c2 {
        background: #7ef0c1;
      }
      .chip.c3 {
        background: #8fd3ff;
      }
      .chip.c4 {
        background: #c8b8ff;
      }
      .ptr {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 5;
      }
      .ring {
        position: absolute;
        left: 1000px;
        top: 572px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 6px solid #ffd23f;
      }
      /* outro */
      .outro {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .o-logo {
        display: flex;
        align-items: center;
        gap: 22px;
        font: 850 64px/1 'Nunito Variable';
        margin-bottom: 64px;
      }
      .o-logo svg {
        width: 104px;
        height: 104px;
      }
      .o-logo b {
        font-weight: 950;
        background: linear-gradient(90deg, #b9a6ff, #ff7eb3);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .o-line {
        font: 950 112px/1.06 'Nunito Variable';
        letter-spacing: -0.04em;
      }
      .o-url {
        margin-top: 70px;
        padding: 20px 36px;
        border-radius: 20px;
        background: #ffd23f;
        color: #1d1145;
        font: 900 40px/1 'Nunito Variable';
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
      }
      .o-small {
        margin-top: 28px;
        font: 600 30px/1 'Inter Variable';
        color: #cfc6f2;
      }
      /* title card */
      .title {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .t-kicker {
        padding: 12px 24px;
        border-radius: 14px;
        background: var(--acc);
        color: #1d1145;
        font: 900 32px/1 'Nunito Variable';
        margin-bottom: 34px;
      }
      .t-title {
        font: 950 120px/1.02 'Nunito Variable';
        letter-spacing: -0.04em;
        max-width: 1500px;
      }
      .t-sub {
        margin-top: 28px;
        font: 600 38px/1.3 'Inter Variable';
        color: #d6ccff;
        max-width: 1300px;
      }
    </style>
  </head>
  <body>
    <div id="stage" class="stage"></div>
  </body>
</html>
